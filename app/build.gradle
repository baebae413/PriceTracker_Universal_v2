plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pricetracker'
    compileSdk 35

    signingConfigs {
    release {
        storeFile file("../pricetracker.keystore")
        storePassword "pricetracker123"
        keyAlias "pricetracker"
        keyPassword "pricetracker123"
    }
    }

    defaultConfig {
        applicationId 'ru.pricetracker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
